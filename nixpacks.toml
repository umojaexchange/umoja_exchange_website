# nixpacks.toml — force both Python 3.11 and Node 20 in the Railway build.
# NOTE: nodejs_20 already bundles npm — do NOT add nodePackages.npm separately
#       or Nix will throw a file-collision error (exit code 100).

providers = []   # disable auto-detection

[phases.setup]
nixPkgs = [
  "python311",
  "python311Packages.pip",
  "nodejs_20",
]

[phases.install]
cmds = []        # build.sh handles npm install + pip install in correct order

[phases.build]
cmds = ["make railway-build"]

[start]
cmd = "make railway-start"